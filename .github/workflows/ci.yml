name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo build --target wasm32v1-none --release --workspace --exclude sandbox-runner --exclude greeter --exclude test-asset
      - name: Compare source-built WASM with committed prebuilt artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(prebuilt/*.wasm)
          test "${#artifacts[@]}" -gt 0
          for prebuilt in "${artifacts[@]}"; do
            filename="${prebuilt##*/}"
            package="${filename%.wasm}"
            crate="${package//-/_}"
            fresh="target/wasm32v1-none/release/${crate}.wasm"
            test -f "$fresh"
            echo "FRESH $package $(stat -c '%s' "$fresh") bytes $(sha256sum "$fresh" | cut -d' ' -f1)"
            echo "PREBUILT $package $(stat -c '%s' "$prebuilt") bytes $(sha256sum "$prebuilt" | cut -d' ' -f1)"
            cmp -- "$fresh" "$prebuilt"
            echo "MATCH $package"
          done
      - run: sha256sum -c checksums.txt
        working-directory: prebuilt
      - run: cargo test --workspace
